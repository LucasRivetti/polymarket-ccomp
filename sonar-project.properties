# Configuração do SonarCloud (SonarQube Cloud)
# Preencha organization e projectKey com os valores mostrados em
# sonarcloud.io > seu projeto > Information.
sonar.organization=TROCAR_PELA_ORGANIZACAO
sonar.projectKey=TROCAR_PELA_CHAVE_DO_PROJETO
sonar.projectName=Polymarket CCOMP

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.exclusions=src/generated/**
sonar.coverage.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/app/layout.tsx

# Relatório de cobertura gerado pelo Vitest (npm run test:coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
