name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Um novo push no mesmo PR cancela a execução anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # Este nome é o que aparece na proteção de branch como check obrigatório
    name: Lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes com cobertura
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Guardar relatório de cobertura
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  sonarcloud:
    name: SonarCloud
    needs: ci
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Aviso de configuração pendente
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::Secret SONAR_TOKEN não configurado; análise do SonarCloud ignorada. Veja o README."

      - uses: actions/checkout@v7
        if: env.SONAR_TOKEN != ''
        with:
          # Histórico completo: o Sonar usa o git blame para saber o que é código novo
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        if: env.SONAR_TOKEN != ''
        with:
          name: coverage
          path: coverage

      - name: Análise do SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
