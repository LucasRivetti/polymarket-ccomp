name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Um novo push no mesmo PR cancela a execução anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # Este nome é o que aparece na proteção de branch como check obrigatório
    name: Lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes com cobertura
        run: npm run test:coverage

      - name: Build
        run: npm run build
